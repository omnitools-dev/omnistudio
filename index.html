<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStudio - Pro Thumbnail Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0F17',
            panelDark: '#111827',
            borderDark: '#1F293D',
            gaming: '#EF4444',
            food: '#F59E0B',
            tech: '#3B82F6',
            fitness: '#10B981',
            finance: '#059669',
            vlog: '#A855F7'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0B0F17; color: #F3F4F6; font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1F293D; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- TOP BAR / HEADER -->
  <header class="h-14 bg-panelDark border-b border-borderDark flex items-center justify-between px-4 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center font-bold text-white shadow-lg">
        O
      </div>
      <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">OmniStudio</span>
      <span class="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800/50">1080p Engine Active</span>
    </div>

    <!-- TUTORIAL VIDEO GUIDES BUTTONS -->
    <div class="hidden md:flex items-center gap-2">
      <span class="text-xs text-gray-400 mr-1"><i class="fa-solid fa-circle-play text-red-500 mr-1"></i> Video Guides:</span>
      <button onclick="openVideoModal('Gaming Pro Tutorial', 'https://www.youtube.com/embed/dQw4w9WgXcQ')" class="text-xs px-2.5 py-1 rounded bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 transition">🎮 Gaming</button>
      <button onclick="openVideoModal('Food Vlogging Guide', 'https://www.youtube.com/embed/dQw4w9WgXcQ')" class="text-xs px-2.5 py-1 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 transition">🍔 Food</button>
      <button onclick="openVideoModal('Tech Review Polish', 'https://www.youtube.com/embed/dQw4w9WgXcQ')" class="text-xs px-2.5 py-1 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 transition">📱 Tech</button>
      <button onclick="openVideoModal('Fitness Transformation', 'https://www.youtube.com/embed/dQw4w9WgXcQ')" class="text-xs px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 transition">🏋️ Fitness</button>
    </div>

    <div class="flex items-center gap-3">
      <label class="text-xs bg-slate-800 hover:bg-slate-700 text-white font-medium px-3 py-1.5 rounded cursor-pointer transition border border-gray-700">
        <i class="fa-solid fa-upload mr-1"></i> Remix/Upload
        <input type="file" id="uploadImage" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
      </label>
      <button onclick="exportThumbnail()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded shadow-lg shadow-blue-600/30 transition flex items-center gap-1">
        <i class="fa-solid fa-download"></i> Download 1080p
      </button>
      <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-1 rounded">4K (Soon)</span>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex overflow-hidden">

    <!-- LEFT SIDEBAR: CATEGORIES -->
    <aside class="w-20 bg-panelDark border-r border-borderDark flex flex-col items-center py-4 gap-4 z-10">
      <button onclick="setCategory('gaming')" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-red-400 transition">
        <div class="w-10 h-10 rounded-xl bg-gray-800 group-hover:bg-red-500/20 border border-gray-700 group-hover:border-red-500/50 flex items-center justify-center">
          <i class="fa-solid fa-gamepad text-lg"></i>
        </div>
        <span class="text-[10px]">Gaming</span>
      </button>

      <button onclick="setCategory('food')" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-amber-400 transition">
        <div class="w-10 h-10 rounded-xl bg-gray-800 group-hover:bg-amber-500/20 border border-gray-700 group-hover:border-amber-500/50 flex items-center justify-center">
          <i class="fa-solid fa-utensils text-lg"></i>
        </div>
        <span class="text-[10px]">Food</span>
      </button>

      <button onclick="setCategory('tech')" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-blue-400 transition">
        <div class="w-10 h-10 rounded-xl bg-gray-800 group-hover:bg-blue-500/20 border border-gray-700 group-hover:border-blue-500/50 flex items-center justify-center">
          <i class="fa-solid fa-mobile-screen-button text-lg"></i>
        </div>
        <span class="text-[10px]">Tech</span>
      </button>

      <button onclick="setCategory('fitness')" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-emerald-400 transition">
        <div class="w-10 h-10 rounded-xl bg-gray-800 group-hover:bg-emerald-500/20 border border-gray-700 group-hover:border-emerald-500/50 flex items-center justify-center">
          <i class="fa-solid fa-dumbbell text-lg"></i>
        </div>
        <span class="text-[10px]">Fitness</span>
      </button>

      <button onclick="setCategory('vlog')" class="flex flex-col items-center gap-1 group text-gray-400 hover:text-purple-400 transition">
        <div class="w-10 h-10 rounded-xl bg-gray-800 group-hover:bg-purple-500/20 border border-gray-700 group-hover:border-purple-500/50 flex items-center justify-center">
          <i class="fa-solid fa-camera text-lg"></i>
        </div>
        <span class="text-[10px]">Vlog</span>
      </button>
    </aside>

    <!-- CENTER CANVAS EDITOR -->
    <main class="flex-1 bg-brandDark p-6 flex flex-col items-center justify-center relative overflow-auto">
      <!-- CANVAS CONTROLS -->
      <div class="mb-3 flex items-center gap-3 bg-panelDark px-4 py-2 rounded-lg border border-borderDark text-xs">
        <button onclick="addText()" class="hover:text-cyan-400 transition"><i class="fa-solid fa-font mr-1"></i> Add Text</button>
        <span class="text-gray-600">|</span>
        <button onclick="clearCanvas()" class="hover:text-red-400 transition"><i class="fa-solid fa-trash mr-1"></i> Clear All</button>
      </div>

      <!-- MAIN CANVAS CONTAINER -->
      <div class="relative shadow-2xl rounded-lg overflow-hidden border border-borderDark bg-black" style="width: 854px; height: 480px;">
        <canvas id="thumbnailCanvas" width="1920" height="1080" class="w-full h-full object-contain"></canvas>
      </div>
      <p class="text-[11px] text-gray-500 mt-2">1080p High-Resolution Preview Rendered Live</p>
    </main>

    <!-- RIGHT SIDEBAR: REALISTIC 3D ASSETS SEARCH -->
    <aside class="w-80 bg-panelDark border-l border-borderDark flex flex-col custom-scrollbar overflow-y-auto p-4 z-10">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">3D Realistic Asset Library</h3>
      
      <!-- SEARCH BOX -->
      <div class="relative mb-4">
        <input type="text" id="assetSearch" oninput="filterAssets()" placeholder="Search 3D models, props, objects..." class="w-full bg-brandDark text-xs text-gray-200 pl-8 pr-3 py-2 rounded-lg border border-borderDark focus:outline-none focus:border-cyan-500 transition">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-gray-500"></i>
      </div>

      <!-- ASSETS GRID -->
      <div id="assetsGrid" class="grid grid-cols-2 gap-2">
        <!-- JS populates realistic assets here -->
      </div>
    </aside>
  </div>

  <!-- VIDEO MODAL -->
  <div id="videoModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden">
    <div class="bg-panelDark border border-borderDark rounded-xl w-11/12 max-w-3xl p-4 relative">
      <button onclick="closeVideoModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 id="modalTitle" class="text-sm font-bold text-white mb-3">Video Guide</h3>
      <div class="aspect-video w-full rounded-lg overflow-hidden border border-borderDark">
        <iframe id="modalIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('thumbnailCanvas');
    const ctx = canvas.getContext('2d');
    
    // Sample Assets Data
    const assetData = [
      { name: "3D Gaming Chair", cat: "gaming", url: "https://images.unsplash.com/photo-1598550476439-6847785fcea6?w=400&auto=format&fit=crop&q=60" },
      { name: "Gourmet Burger", cat: "food", url: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&auto=format&fit=crop&q=60" },
      { name: "Smartphone 3D", cat: "tech", url: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&auto=format&fit=crop&q=60" },
      { name: "3D Dumbbell", cat: "fitness", url: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=400&auto=format&fit=crop&q=60" },
      { name: "Neon Arrow", cat: "vlog", url: "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=400&auto=format&fit=crop&q=60" }
    ];

    let currentBg = null;
    let textElements = [];

    function initCanvas() {
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#374151';
      ctx.font = 'bold 48px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SELECT A CATEGORY OR UPLOAD AN IMAGE TO START', canvas.width / 2, canvas.height / 2);
    }

    function renderAssets(filter = "") {
      const grid = document.getElementById('assetsGrid');
      grid.innerHTML = "";
      assetData.filter(a => a.name.toLowerCase().includes(filter.toLowerCase())).forEach(asset => {
        const item = document.createElement('div');
        item.className = "bg-brandDark border border-borderDark p-2 rounded-lg hover:border-cyan-500 cursor-pointer transition flex flex-col items-center";
        item.onclick = () => addAssetToCanvas(asset.url);
        item.innerHTML = `
          <img src="${asset.url}" class="w-20 h-20 object-cover rounded mb-1">
          <span class="text-[10px] text-gray-300 text-center truncate w-full">${asset.name}</span>
        `;
        grid.appendChild(item);
      });
    }

    function addAssetToCanvas(url) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        ctx.drawImage(img, 100, 100, 400, 400);
      };
      img.src = url;
    }

    function filterAssets() {
      const query = document.getElementById('assetSearch').value;
      renderAssets(query);
    }

    function setCategory(cat) {
      const colors = {
        gaming: '#EF4444',
        food: '#F59E0B',
        tech: '#3B82F6',
        fitness: '#10B981',
        vlog: '#A855F7'
      };
      ctx.fillStyle = '#0B0F17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = colors[cat] || '#3B82F6';
      ctx.font = 'bold 80px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cat.toUpperCase() + ' THUMBNAIL STUDIO', canvas.width / 2, canvas.height / 2);
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function addText() {
      const text = prompt("Enter text:", "NEW VIDEO!");
      if (!text) return;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 90px Inter, sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 20;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 100);
      ctx.shadowBlur = 0;
    }

    function clearCanvas() {
      initCanvas();
    }

    function exportThumbnail() {
      const link = document.createElement('a');
      link.download = 'OmniStudio-Thumbnail-1080p.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    function openVideoModal(title, url) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalIframe').src = url;
      document.getElementById('videoModal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('modalIframe').src = "";
      document.getElementById('videoModal').classList.add('hidden');
    }

    // Initialize on load
    initCanvas();
    renderAssets();
  </script>
</body>
</html>
