<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniStudio - Pro Thumbnail Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Fabric.js for Real Canvas Manipulation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/531/fabric.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0F17',
            panelDark: '#111827',
            borderDark: '#1F293D',
            accentCyan: '#06B6D4'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0B0F17; color: #F3F4F6; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden select-none">

  <!-- TOP APP BAR -->
  <header class="h-14 bg-panelDark border-b border-borderDark flex items-center justify-between px-3 z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center font-bold text-white shadow-md">
        O
      </div>
      <div>
        <h1 class="text-sm font-bold text-white leading-none">OmniStudio</h1>
        <span class="text-[9px] text-cyan-400 font-medium">Pro Canvas Studio</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <label class="text-xs bg-gray-800 active:bg-gray-700 text-gray-200 px-2.5 py-1.5 rounded-lg border border-borderDark flex items-center gap-1 cursor-pointer">
        <i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i>
        <span>Upload</span>
        <input type="file" id="imageUploader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
      </label>
      <button onclick="exportThumbnail()" class="text-xs bg-cyan-600 active:bg-cyan-500 text-white font-semibold px-3 py-1.5 rounded-lg shadow-lg shadow-cyan-600/30 flex items-center gap-1">
        <i class="fa-solid fa-download"></i> 1080p HD
      </button>
    </div>
  </header>

  <!-- WORKSPACE / CANVAS AREA -->
  <main class="flex-1 bg-brandDark p-2 flex flex-col items-center justify-center relative overflow-hidden">
    <div class="border border-borderDark rounded-lg shadow-2xl overflow-hidden bg-black relative" style="width: 100%; max-width: 800px; aspect-ratio: 16/9;">
      <canvas id="thumbnailCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- CANVAS TOOLS -->
    <div class="flex items-center gap-2 mt-3 flex-wrap justify-center">
      <button onclick="addText()" class="text-xs bg-panelDark border border-borderDark px-3 py-1.5 rounded-lg text-gray-200 active:bg-gray-800 flex items-center gap-1"><i class="fa-solid fa-font text-cyan-400"></i> Add Text</button>
      <button onclick="deleteSelected()" class="text-xs bg-panelDark border border-borderDark px-3 py-1.5 rounded-lg text-red-400 active:bg-gray-800 flex items-center gap-1"><i class="fa-solid fa-trash"></i> Delete Selected</button>
      <button onclick="clearCanvas()" class="text-xs bg-panelDark border border-borderDark px-3 py-1.5 rounded-lg text-gray-400 active:bg-gray-800 flex items-center gap-1"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>
  </main>

        <i class="fa-solid fa-magnifying-glass absolute left-2 top-2 text-[10px] text-gray-500"></i>
      </div>
    </div>
